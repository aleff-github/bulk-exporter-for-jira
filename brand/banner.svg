<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 548" width="1120" height="548" role="img" aria-label="Grounded Export for Jira banner">
  <defs>
    <linearGradient id="logoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7A57"/>
      <stop offset="1" stop-color="#0A5A40"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7A57"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="rightwash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FBF8"/>
      <stop offset="1" stop-color="#ECF7F2"/>
    </linearGradient>
  </defs>

  <!-- Sfondo -->
  <rect x="0" y="0" width="1120" height="548" fill="#FFFFFF"/>
  <!-- Pannello destro con leggera velatura smeraldo -->
  <rect x="712" y="12" width="408" height="536" fill="url(#rightwash)"/>
  <!-- Barra di accento in alto -->
  <rect x="0" y="0" width="1120" height="12" fill="url(#topbar)"/>

  <!-- ===== LOCKUP LOGO + TITOLO ===== -->
  <g transform="translate(72,54) scale(0.30)">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#logoBg)"/>
    <rect x="120" y="100" width="210" height="300" rx="22" fill="#FFFFFF"/>
    <rect x="152" y="156" width="146" height="22" rx="11" fill="#0A5A40"/>
    <rect x="152" y="200" width="146" height="22" rx="11" fill="#0A5A40"/>
    <rect x="152" y="244" width="96"  height="22" rx="11" fill="#F5A623"/>
    <circle cx="372" cy="372" r="98" fill="#FFFFFF"/>
    <circle cx="372" cy="372" r="82" fill="#F5A623"/>
    <g transform="rotate(45 372 372)" fill="#0A5A40">
      <rect x="358" y="368" width="28" height="56" rx="8"/>
      <path d="M 340 374 L 404 374 L 372 332 Z"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="252" y="118" font-size="44" font-weight="700" fill="#172B4D">Grounded Export for Jira</text>
    <text x="252" y="160" font-size="23" fill="#42526E">Export Jira issues to PDF, Excel and CSV — <tspan font-weight="700" fill="#0A5A40">no 1,000-issue limit.</tspan></text>

    <!-- Divisore -->
    <rect x="72" y="214" width="976" height="2" rx="1" fill="#EBECF0"/>

    <!-- ===== HIGHLIGHTS (sinistra) ===== -->
    <g font-size="22" fill="#42526E">
      <circle cx="80" cy="286" r="5" fill="#0E7A57"/>
      <text x="100" y="293">Tables, panels and images render just like in Jira</text>
      <circle cx="80" cy="340" r="5" fill="#0E7A57"/>
      <text x="100" y="347">Excel with autofilter; CSV opens correctly anywhere</text>
      <circle cx="80" cy="394" r="5" fill="#0E7A57"/>
      <text x="100" y="401">Runs on Atlassian — read-only, no external servers</text>
    </g>

    <!-- Footer vendor -->
    <text x="72" y="508" font-size="19" fill="#5E6C84"><tspan font-weight="700" fill="#172B4D">Grounded</tspan>   ·   support@groundedwp.com</text>
  </g>

  <!-- ===== SCHEDE FORMATO (destra) ===== -->
  <!-- PDF -->
  <g transform="translate(748,250)">
    <rect x="0" y="0" width="100" height="168" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1.5"/>
    <path d="M 0 34 L 0 12 Q 0 0 12 0 L 88 0 Q 100 0 100 12 L 100 34 Z" fill="#DE350B"/>
    <text x="50" y="23" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">PDF</text>
    <rect x="16" y="56"  width="68" height="9" rx="4.5" fill="#EBECF0"/>
    <rect x="16" y="78"  width="68" height="9" rx="4.5" fill="#EBECF0"/>
    <rect x="16" y="100" width="44" height="9" rx="4.5" fill="#EBECF0"/>
    <rect x="16" y="128" width="68" height="22" rx="4" fill="#F4F5F7"/>
  </g>
  <!-- XLSX -->
  <g transform="translate(858,250)">
    <rect x="0" y="0" width="100" height="168" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1.5"/>
    <path d="M 0 34 L 0 12 Q 0 0 12 0 L 88 0 Q 100 0 100 12 L 100 34 Z" fill="#36B37E"/>
    <text x="50" y="23" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">XLSX</text>
    <g fill="#EBECF0">
      <rect x="16" y="56"  width="30" height="18" rx="3"/>
      <rect x="54" y="56"  width="30" height="18" rx="3"/>
      <rect x="16" y="80"  width="30" height="18" rx="3"/>
      <rect x="54" y="80"  width="30" height="18" rx="3"/>
      <rect x="16" y="104" width="30" height="18" rx="3"/>
      <rect x="54" y="104" width="30" height="18" rx="3"/>
      <rect x="16" y="128" width="30" height="18" rx="3"/>
      <rect x="54" y="128" width="30" height="18" rx="3"/>
    </g>
  </g>
  <!-- CSV -->
  <g transform="translate(968,250)">
    <rect x="0" y="0" width="100" height="168" rx="12" fill="#FFFFFF" stroke="#DFE1E6" stroke-width="1.5"/>
    <path d="M 0 34 L 0 12 Q 0 0 12 0 L 88 0 Q 100 0 100 12 L 100 34 Z" fill="#F5A623"/>
    <text x="50" y="23" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">CSV</text>
    <g fill="#EBECF0">
      <rect x="16" y="58"  width="40" height="9" rx="4.5"/>
      <rect x="60" y="58"  width="24" height="9" rx="4.5"/>
      <rect x="16" y="82"  width="28" height="9" rx="4.5"/>
      <rect x="48" y="82"  width="36" height="9" rx="4.5"/>
      <rect x="16" y="106" width="36" height="9" rx="4.5"/>
      <rect x="56" y="106" width="28" height="9" rx="4.5"/>
      <rect x="16" y="130" width="30" height="9" rx="4.5"/>
      <rect x="50" y="130" width="34" height="9" rx="4.5"/>
    </g>
  </g>
</svg>
