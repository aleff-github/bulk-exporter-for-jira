<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bulk Exporter for Jira">
  <!-- Fondo: quadrato stondato, leggibile anche a 32 px -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0052CC"/>

  <!-- Pila di fogli: suggerisce il volume, non la singola issue -->
  <rect x="150" y="84"  width="182" height="236" rx="14" fill="#FFFFFF" opacity="0.26"/>
  <rect x="132" y="104" width="182" height="236" rx="14" fill="#FFFFFF" opacity="0.48"/>
  <rect x="114" y="124" width="182" height="236" rx="14" fill="#FFFFFF"/>

  <!-- Righe di contenuto sul foglio in primo piano -->
  <g fill="#0052CC">
    <rect x="142" y="168" width="126" height="20" rx="10"/>
    <rect x="142" y="208" width="126" height="20" rx="10"/>
    <rect x="142" y="248" width="86"  height="20" rx="10"/>
  </g>

  <!-- Pastiglia di export: il bordo bianco la stacca dalla pila -->
  <circle cx="366" cy="370" r="92" fill="#FFFFFF"/>
  <circle cx="366" cy="370" r="76" fill="#0052CC"/>

  <!-- Freccia verso il basso -->
  <g fill="#FFFFFF">
    <rect x="352" y="322" width="28" height="58" rx="8"/>
    <path d="M 318 372 L 414 372 L 366 424 Z"/>
  </g>
</svg>
